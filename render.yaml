# Render Blueprint: backend API (Docker). Dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: mirava-api
    runtime: docker
    rootDir: backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://hbieogxenfovyohvaqku.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SITE_URL
        sync: false
      - key: APPS_SCRIPT_URL
        sync: false
      - key: APPS_SCRIPT_SECRET
        sync: false
